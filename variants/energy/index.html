<body><div id="sbx-flag" style="position:fixed;top:env(safe-area-inset-top,0);left:50%;transform:translateX(-50%);z-index:9999;background:#f5a623;color:#111;font:600 10px/1 system-ui;padding:3px 8px;border-radius:0 0 6px 6px;pointer-events:none">SANDBOX · ENERGY</div>
<div id="root"></div>
<!-- VARIANT: loads after #root so it wins over the in-app styles; variant.js sets window.VARIANT before app.js -->
<link rel="stylesheet" href="variant.css">
<script src="variant.js"></script>

<!-- React itself, loaded from a CDN so there's no install/build step -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<!-- Babel lets the browser understand JSX directly, so you can edit app.js as plain JSX -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- Firebase + notification logic: must load BEFORE app.js, since app.js
     checks window.STNotify as soon as it starts up -->
<script src="notifications.js"></script>
<script src="scripts/cleanup.js"></script>
<script src="scripts/flightlog.js"></script>
<script src="scripts/handover.js"></script>
<script src="scripts/road-pick.js"></script>

<!-- Bug A fix (flag "noPinch"): the iOS elastic pinch-zoom-out shrinks the whole page (header included) to ~70% and springs back.
     touch-action stops the pinch on modern iOS; the gesture* listeners cover Safari/home-screen mode. Zoom for accessibility stays available through iOS Accessibility Zoom. -->
<style>html.fx-nopinch { touch-action: pan-x pan-y; }</style>
<script>
(function () {
  function on() { try { return window.SBX && typeof window.SBX.flag === "function" ? !!window.SBX.flag("noPinch") : true; } catch (e) { return true; } }
  function sync() { document.documentElement.classList.toggle("fx-nopinch", on()); }
  sync(); window.addEventListener("sbx-flags", sync); window.addEventListener("load", sync);
  ["gesturestart", "gesturechange", "gesturend"].forEach(function (t) {
    document.addEventListener(t, function (e) { if (on()) e.preventDefault(); }, { passive: false });
  });
})();
</script>
<script type="text/babel" src="app.js"></script>
</body>
</html>
