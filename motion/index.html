<title>Starship Tracker · motion pass (prototype)</title>

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>html, body { margin:0; background: radial-gradient(130% 55% at 50% -8%, #2E3D63 0%, #1A2236 62%) #1A2236; }</style>
<script>
// PROTOTYPE ONLY. Before/After choice persists per device. Default = After.
(function(){var m=null;try{m=localStorage.getItem("st-motion-proto")}catch(e){}
 if(new URLSearchParams(location.search).get("v")==="before")m="before";
 if(m==="before")document.documentElement.classList.remove("mo");})();
// No notifications in this copy: a stub that says "already decided, off" so the first-visit prompt never shows.
window.STNotify={hasDecided:()=>true,getStatus:()=>"off",subscribe:async()=>({ok:false,reason:"prototype"}),unsubscribe:async()=>({ok:true}),dismiss:()=>{},sendFeedback:async()=>({ok:false,reason:"prototype"})};
// No live data calls: Launch Library requests are answered from a snapshot taken 21 Nov 16:00 UK.
(function(){const real=window.fetch.bind(window);let snap=null;
 window.fetch=function(u,o){const s=String(u&&u.url||u);
  if(/thespacedevs\.com/.test(s)){snap=snap||real("data/ll2-upcoming.json").then(r=>r.json());
   return snap.then(j=>{if(/\/upcoming\//.test(s))return new Response(JSON.stringify(j),{status:200,headers:{"content-type":"application/json"}});
     const id=(s.match(/launches\/([0-9a-f-]{36})/)||[])[1];const hit=j.results.find(x=>x.id===id);
     return hit?new Response(JSON.stringify(hit),{status:200,headers:{"content-type":"application/json"}}):new Response("{}",{status:404});});}
  return real(u,o);};
 if(navigator.serviceWorker&&navigator.serviceWorker.register){navigator.serviceWorker.register=()=>Promise.reject(new Error("disabled in prototype"));}
})();
</script>

</body>
